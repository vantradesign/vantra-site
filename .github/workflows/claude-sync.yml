# Triggered once the watcher workflow (watch-org.yml) detects a change
# in the vantradesign organization, and starts Claude Code in unattended
# automation mode with the CLAUDE.md context.
#
# IMPORTANT: The exact input parameters of anthropics/claude-code-action
# may change between versions. Always check the current README at
# https://github.com/anthropics/claude-code-action against the fields
# below before the first run.
#
# Authentication runs on an existing Claude Pro/Max subscription rather
# than pay-per-token API billing. To (re-)create the secret:
#
#   1. npm install -g @anthropic-ai/claude-code
#   2. claude  ->  /login  ->  choose the Claude.ai (Pro/Max) login,
#      NOT the Anthropic Console API login
#   3. claude setup-token          # long-lived OAuth token, bound to the plan
#   4. Store the result in this repo as the secret
#      CLAUDE_CODE_OAUTH_TOKEN    (ANTHROPIC_API_KEY is then unused)
#
# The token expires eventually; re-run step 3 and update the secret when
# the job starts failing to authenticate.

name: Vantra Site Auto-Sync (Claude Code)

on:
  repository_dispatch:
    types: [vantra-org-update]
  workflow_dispatch:
    inputs:
      payload:
        description: "Optional manual test payload (JSON)"
        required: false
        default: '{"org":"vantradesign","changes":[]}'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: vantra-site-claude-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vantra-site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Claude is asked to verify its own changes with pnpm, so the toolchain
      # has to exist before the action runs. pnpm/action-setup reads the
      # version from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate app token instead of default GITHUB_TOKEN
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VANTRA_BOT_APP_ID }}
          private-key: ${{ secrets.VANTRA_BOT_PRIVATE_KEY }}

      - name: Determine payload
        id: payload
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo 'json<<EOF' >> "$GITHUB_OUTPUT"
            echo '${{ toJson(github.event.client_payload) }}' >> "$GITHUB_OUTPUT"
            echo 'EOF' >> "$GITHUB_OUTPUT"
          else
            echo 'json<<EOF' >> "$GITHUB_OUTPUT"
            echo '${{ github.event.inputs.payload }}' >> "$GITHUB_OUTPUT"
            echo 'EOF' >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Code sync
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          mode: agent
          prompt: |
            You are Staff Information Architect, Staff Software Architect,
            and Staff Software Engineer for the vantra-site repository.
            First read CLAUDE.md in the repo root to understand the project
            context, content model, and behavior rules, and follow them
            strictly.

            Here is the trigger payload from the organization watcher
            (vantradesign) describing what changed:

            ${{ steps.payload.outputs.json }}

            For each entry in "changes", analyze whether an update to
            vantra-site is warranted (new repo -> new entry, changed
            commits -> update existing content). Do not act on purely
            technical changes with no external impact.

            Implement all updates according to CLAUDE.md: use a dedicated
            branch, then verify with `pnpm run tsc` and `pnpm run generate`
            (there is no lint script; dependencies are already installed),
            then open a pull request with a thorough description. Never
            merge yourself.
            If no change is needed, do not open a PR and briefly summarize
            why not.
          claude_args: |
            --max-turns 60